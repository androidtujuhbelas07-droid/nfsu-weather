; NFSUWeather v2 - letakkan di folder yang sama dengan NFSUWeather.asi
; Alpha: 0 = transparan, 255 = pekat. Warna R,G,B: 0-255.

[Hotkeys]            ; kode tombol desimal (F7=118, F8=119, F9=120)
ToggleRain = 118
ToggleFog  = 119
ToggleDark = 120

[Rain]
Enabled   = 1
Drops     = 500      ; jumlah tetes (maks 2000), dibagi 3 lapisan jauh/tengah/dekat
Speed     = 1300     ; kecepatan jatuh
Length    = 26       ; panjang garis hujan
Wind      = 0.12     ; kemiringan dasar (0 = lurus)
Gust      = 0.10     ; embusan angin yang berubah pelan-pelan (0 = angin tetap)
Alpha     = 120      ; kejelasan hujan
Splash    = 1        ; percikan di jalan (1 = nyala, 0 = mati)
Lightning = 0        ; kilat sesekali (1 = nyala)
LightningAlpha = 110

[Fog]
Enabled      = 1
UseGameFog   = 0     ; JANGAN dinyalakan di GameHub (bikin layar abu-abu)
Horizon      = 0.47  ; posisi garis cakrawala di layar (0 = atas, 1 = bawah)
HorizonAlpha = 110   ; ketebalan kabut di cakrawala
TopAlpha     = 20    ; ketebalan kabut di bagian atas layar
BottomAlpha  = 25    ; ketebalan kabut di bagian bawah layar
R = 75
G = 82
B = 98

[DarkSky]
Enabled     = 1
TopAlpha    = 150    ; gelap di langit (atas layar)
BottomAlpha = 40     ; gelap di bagian bawah layar (jalan & HUD)
R = 5
G = 8
B = 25
