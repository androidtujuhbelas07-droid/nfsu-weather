; NFSUWeather.ini - letakkan di folder yang sama dengan NFSUWeather.asi
; Nilai warna 0-255. Alpha: 0 = transparan, 255 = pekat.

[Hotkeys]            ; kode tombol desimal (F7=118, F8=119, F9=120)
ToggleRain = 118
ToggleFog  = 119
ToggleDark = 120

[Rain]
Enabled = 1
Drops   = 400        ; jumlah tetes (maks 2000)
Speed   = 1400       ; kecepatan jatuh
Length  = 28         ; panjang garis hujan
Wind    = 0.15       ; kemiringan hujan (0 = lurus)
Alpha   = 110        ; transparansi hujan

[Fog]
Enabled    = 1
UseGameFog = 1       ; paksa kabut bawaan Direct3D (bisa tidak berefek di objek ber-shader)
Start      = 30      ; jarak mulai kabut
End        = 250     ; jarak kabut pekat penuh
HazeAlpha  = 60      ; lapisan kabut layar (selalu berefek). 0 = matikan
R = 150
G = 155
B = 165

[DarkSky]
Enabled = 1
Alpha   = 110        ; makin besar makin gelap (HUD ikut agak gelap)
R = 5
G = 8
B = 25
