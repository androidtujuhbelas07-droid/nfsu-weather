name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile
        run: cl /LD /O2 /EHsc /MT NFSUWeather.cpp user32.lib /Fe:NFSUWeather.asi
      - uses: actions/upload-artifact@v4
        with:
          name: NFSUWeather
          path: |
            NFSUWeather.asi
            NFSUWeather.ini
